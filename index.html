<!DOCTYPE html>
<html lang="sv">

<head>
  <title>En gång är ingen gång!</title>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="När vann bajen senast ett SM-Guld?">

  <link rel="icon" type="image/x-icon" href="img/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap"/>
  <link rel="stylesheet" href="src/style.css"/>
  <script src="src/script.js"></script>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="d93a0cc5-dab2-402d-a884-40b1bab7a5e3"></script>
</head>

<body>
  <main class="background optimized-background">
    <section class="timer-card" aria-labelledby="page-title">
      <h1 id="page-title">När vann bajen senast ett SM-guld?</h1>
      <div class="countup" id="countup1">
        <div class="time-unit container-years">
          <h2 class="years">00</h2>
          <p class="label">år</p>
        </div>
        <div class="time-unit container-days">
          <h2 class="days">00</h2>
          <p class="label">dagar</p>
        </div>
        <div class="time-unit container-hours">
          <h2 class="hours">00</h2>
          <p class="label">tim</p>
        </div>
        <div class="time-unit container-minutes">
          <h2 class="minutes">00</h2>
          <p class="label">min</p>
        </div>
        <div class="time-unit container-seconds">
          <h2 class="seconds">00</h2>
          <p class="label">sek</p>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
